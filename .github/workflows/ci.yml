name: POS Quality and Portfolio Release

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - codex/original-netlify-release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, unit tests and Prisma schema
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/startek_portfolio_a1b2c3d4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Verify no local dotenv or database dumps are committed
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v -E '(^|/)\.env\.example$'; then
            echo 'A local dotenv file is tracked. Blocking the release.'
            exit 1
          fi
          if git ls-files | grep -E '\.(dump|sql\.gz)$'; then
            echo 'A database dump is tracked. Blocking the release.'
            exit 1
          fi

  cloud-build:
    name: Cloud-compatible build and packaging guard
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      POS_DEPLOYMENT: cloud
      # Deliberately invalid DNS; build must never require a real database connection.
      DATABASE_URL: postgresql://ci:ci@ep-ci-pooler.c-4.ap-southeast-1.aws.neon.tech/startek_portfolio?sslmode=verify-full
      AUTH_URL: https://pos-ci.example.invalid
      TRUSTED_ORIGIN: https://pos-ci.example.invalid
      NEXT_PUBLIC_APP_NAME: Startek POS CI
      NEXT_PUBLIC_APP_VERSION: ci
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate ephemeral signing secret
        shell: bash
        run: |
          value="$(openssl rand -hex 48)"
          echo "::add-mask::$value"
          echo "AUTH_SECRET=$value" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build using Netlify cloud configuration
        run: npm run build:netlify
      - name: Fail if runtime bundle contains local dotenv files
        shell: bash
        run: |
          test -f .next/standalone/server.js
          if find .next -type f -name '.env*' -print -quit | grep -q .; then
            echo 'Local dotenv found inside Next.js output. Blocking release.'
            exit 1
          fi

  browser-integration:
    name: PostgreSQL, receipt and browser checkout
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/startek_portfolio_a1b2c3d4
      AUTH_URL: http://localhost:3107
      TRUSTED_ORIGIN: http://localhost:3107
      NEXT_PUBLIC_APP_NAME: Startek POS CI
      NEXT_PUBLIC_APP_VERSION: ci
      BACKUP_DIR: ${{ runner.temp }}/startek-pos-backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Generate per-run test-only credentials
        shell: bash
        run: |
          secret="$(openssl rand -hex 48)"
          password="$(openssl rand -hex 22)Aa7!"
          echo "::add-mask::$secret"
          echo "::add-mask::$password"
          echo "AUTH_SECRET=$secret" >> "$GITHUB_ENV"
          echo "SEED_SUPER_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Install dependencies and PostgreSQL client utilities
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          mkdir -p "$BACKUP_DIR"
          chmod 700 "$BACKUP_DIR"
          pg_dump --version
      - name: Create disposable database, migrate and seed
        shell: bash
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE startek_portfolio_a1b2c3d4;'
          npx prisma generate
          npx prisma migrate deploy
          npx prisma migrate status
          npx prisma db seed
      - name: Build standalone application
        run: npm run build
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Start isolated application
        shell: bash
        run: |
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public
          PORT=3107 HOSTNAME=127.0.0.1 node .next/standalone/server.js > "$RUNNER_TEMP/pos-ci-server.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://localhost:3107/api/health > /dev/null; then
              echo 'Isolated POS application is ready.'
              exit 0
            fi
            sleep 2
          done
          echo 'Application did not become healthy.'
          tail -n 70 "$RUNNER_TEMP/pos-ci-server.log"
          exit 1
      - name: Browser QA — roles, orders, checkout and backups
        run: npm run test:e2e
      - name: Diagnostics if a browser test fails
        if: failure()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/pos-ci-server.log"; then
            tail -n 100 "$RUNNER_TEMP/pos-ci-server.log"
          fi
